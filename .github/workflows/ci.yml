name: Public snapshot diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LEERNESS_OFFLINE: '1'
      LANGUAGE: ko
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: gugu9999gu/leerness
          ref: b5a3c4631353ba0ab7171cfce5b0c60353223ea3
          path: upstream
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.23.4'
          package-manager-cache: false
      - run: python ci/prepare.py upstream product
      - name: Report four benchmark observations
        working-directory: product
        env:
          LEERNESS_NO_AUTO_ROADMAP: '1'
          LANG: ''
          LC_ALL: ''
          LC_CTYPE: ''
        run: |
          set +e
          project=$(mktemp -d)
          node bin/leerness.js init "$project" --yes --no-banner --no-stale-check --language ko --skills recommended
          echo "init exit $?"
          node bin/leerness.js benchmark "$project" --scenario all --json > "$RUNNER_TEMP/benchmark.json"
          echo "benchmark exit $?"
          python - "$RUNNER_TEMP/benchmark.json" <<'PY'
          import json, pathlib, sys
          raw = pathlib.Path(sys.argv[1]).read_text().lstrip()
          result, end = json.JSONDecoder().raw_decode(raw)
          for case in result.get('scenarios', []):
              print(json.dumps({key: case.get(key) for key in ('key', 'detected', 'level', 'exit', 'sample')}, ensure_ascii=False))
          tail = raw[end:].strip()
          print('Additional stdout after JSON:', repr(tail[:1600]))
          sys.exit(int(bool(tail) or result.get('detectedCount') != 4))
          PY
      - name: Test changed graph fixtures
        if: success() || failure()
        working-directory: product
        run: node scripts/store-values-probe.js --match 'the graph page'
      - name: Validate release runtime
        working-directory: product
        run: node scripts/release-runtime-probe.js
      - name: Verify graph documents and session metadata
        working-directory: product
        run: node --test scripts/derived-input-publication-probe.js
      - name: Check task output and generated roadmap
        working-directory: product
        run: node scripts/skill-task-command-probe.js
      - name: Verify adapter completion and concurrent merge
        working-directory: product
        run: node scripts/repl-adapter-command-probe.js
      - name: Verify review guidance and budgets
        working-directory: product
        run: |
          node --test scripts/task-review-assessment-probe.js
          node scripts/review-feedback-probe.js
