name: Public snapshot diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LEERNESS_OFFLINE: '1'
      LEERNESS_NO_AUTO_ROADMAP: '1'
      LANGUAGE: ko
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: gugu9999gu/leerness
          ref: b5a3c4631353ba0ab7171cfce5b0c60353223ea3
          path: upstream
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.23.4'
          package-manager-cache: false
      - run: python ci/prepare.py upstream product
      - name: Report four benchmark observations
        working-directory: product
        env:
          LANG: ''
          LC_ALL: ''
          LC_CTYPE: ''
        run: |
          set +e
          project=$(mktemp -d)
          node bin/leerness.js init "$project" --yes --no-banner --no-stale-check --language ko --skills recommended
          echo "init exit $?"
          node bin/leerness.js benchmark "$project" --scenario all --json > "$RUNNER_TEMP/benchmark.json"
          echo "benchmark exit $?"
          node -e "const r = require(process.argv[1]); if (!Array.isArray(r.scenarios)) { console.log(JSON.stringify({error:r.error,code:r.code})); process.exit(1); } for (const s of r.scenarios) console.log(JSON.stringify({key:s.key, detected:s.detected, level:s.level, exit:s.exit, sample:s.sample})); process.exitCode = Number(r.detectedCount !== 4)" "$RUNNER_TEMP/benchmark.json"
      - name: Test release commands with local fixtures
        if: success() || failure()
        working-directory: product
        run: node scripts/release-publish-command-probe.js
